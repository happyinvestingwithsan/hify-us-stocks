<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HIFY US Stocks — INDmoney Sync</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #FAFAF8;
      color: #18181B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E4E4E7;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h3 { margin: 0; font-size: 14px; font-weight: 800; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      background: #FDF8E7;
      color: #8E6C20;
      border: 1px solid #E6D29F;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    .count { font-weight: 700; color: #15803D; }
    .btn-primary {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #B6933A;
      background: #C8A951;
      color: #18181B;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover { background: #D4B762; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .links {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .link-btn {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #D4D4D8;
      background: #FFFFFF;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      color: #27272A;
    }
    .link-btn:hover { background: #F4F4F5; }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #52525B;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>HIFY INDmoney Sync</h3>
    <span class="badge">US Stocks</span>
  </div>

  <div class="card">
    <div class="row"><span>Orders APIs captured</span><span id="cnt_orders" class="count">0</span></div>
    <div class="row"><span>Holdings APIs captured</span><span id="cnt_holdings" class="count">0</span></div>
    <div class="row"><span>Wallet APIs captured</span><span id="cnt_wallet" class="count">0</span></div>
    <div class="row"><span>Other APIs captured</span><span id="cnt_other" class="count">0</span></div>
  </div>

  <button id="sync_btn" class="btn-primary">⚡ Sync Now to localhost:3010</button>

  <div class="links">
    <button id="open_orders" class="link-btn">Orders</button>
    <button id="open_holdings" class="link-btn">Holdings</button>
    <button id="open_wallet" class="link-btn">Wallet</button>
  </div>

  <div id="status_msg" class="status">Open an INDmoney US Stocks page, then click Sync Now.</div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
